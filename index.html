<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T&H Spending">
<meta name="theme-color" content="#0D0D0F">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<title>T&H Spending</title>
<style>
:root{--bg:#f0f9ff;--surface:#ffffff;--surface2:#e0f2fe;--border:#bae6fd;--accent:#0284c7;--accent-dim:rgba(2,132,199,0.14);--text:#075985;--text2:#0369a1;--text3:#7dd3fc;--safe-top:env(safe-area-inset-top,44px);--safe-bottom:env(safe-area-inset-bottom,20px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 50%,#f3e8ff 100%);color:var(--text);font-family:'Be Vietnam Pro',-apple-system,sans-serif;overflow:hidden;position:fixed}
#app{width:100%;height:100%;display:flex;flex-direction:column}
.topbar{padding:calc(var(--safe-top) + 6px) 20px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:transparent}
.logo{font-size:20px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#075985 0%,#0369a1 40%,#7e22ce 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo span{background:linear-gradient(135deg,#0369a1 0%,#a855f7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-right{display:flex;gap:10px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text)}
.tabbar{display:flex;padding:0 20px;flex-shrink:0;border-bottom:0.5px solid var(--border);background:transparent}
.tab{font-size:14px;font-weight:500;color:var(--text3);padding:8px 16px 8px 0;cursor:pointer;position:relative;transition:color .2s}
.tab.active{color:var(--text)}
.tab.active::after{content:'';position:absolute;bottom:-0.5px;left:0;width:calc(100% - 16px);height:2px;background:var(--accent);border-radius:2px}
.screen{flex:1;overflow:hidden;display:none;flex-direction:column}
.screen.active{display:flex}
/* CAMERA */
#s-camera{padding:12px 14px;gap:12px}
.vf-wrap{flex:1;border-radius:24px;overflow:hidden;position:relative;background:#000;min-height:0}
#video{width:100%;height:100%;object-fit:cover;display:block}
.vf-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;pointer-events:none}
.vf-top{display:flex;justify-content:space-between;align-items:center;pointer-events:all}
.date-chip{background:rgba(0,0,0,0.55);border:0.5px solid rgba(255,255,255,0.12);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.88);backdrop-filter:blur(8px)}
.vf-top-btns{display:flex;gap:8px;pointer-events:all}
.vf-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.5);border:0.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;backdrop-filter:blur(4px);color:#fff}
.vf-bottom{pointer-events:all}
#caption-input{width:100%;background:rgba(0,0,0,0.5);border:0.5px solid rgba(255,255,255,0.15);border-radius:14px;padding:9px 14px;font-size:13px;color:#fff;font-family:inherit;backdrop-filter:blur(8px);margin-bottom:10px;outline:none}
#caption-input::placeholder{color:rgba(255,255,255,0.35)}
.zoom-row{display:flex;justify-content:center;gap:6px}
.zoom-pill{background:rgba(0,0,0,0.5);border:0.5px solid rgba(255,255,255,0.12);border-radius:20px;padding:4px 11px;font-size:12px;color:rgba(255,255,255,0.55);font-weight:500;cursor:pointer;backdrop-filter:blur(4px);transition:all .15s}
.zoom-pill.active{color:var(--accent);border-color:rgba(2,132,199,0.5)}
.shutter-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0;flex-shrink:0}
.thumb-preview{width:48px;height:48px;border-radius:12px;border:2px solid var(--border);background:var(--surface);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3)}
.thumb-preview img{width:100%;height:100%;object-fit:cover}
.shutter{width:72px;height:72px;border-radius:50%;border:3px solid var(--accent);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shutter-inner{width:58px;height:58px;border-radius:50%;background:#fff;transition:transform .1s ease}
.shutter:active .shutter-inner{transform:scale(0.88)}
.flip-btn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .3s ease}
/* NO CAM */
.no-cam{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text2);text-align:center;padding:24px}
.no-cam .big-icon{font-size:52px}
.no-cam h3{font-size:18px;color:var(--text)}
.no-cam p{font-size:14px;line-height:1.6;max-width:280px;color:var(--text2)}
.no-cam .steps{text-align:left;background:var(--surface);border-radius:14px;padding:14px 16px;width:100%;max-width:300px}
.no-cam .steps li{font-size:13px;line-height:1.7;color:var(--text2);padding-left:4px}
.allow-btn{background:var(--accent);color:#fff;border:none;border-radius:14px;padding:13px 28px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
/* FLASH */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:999;transition:opacity .08s}
/* GALLERY */
#s-gallery{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--safe-bottom) + 14px);gap:20px;align-items:stretch}
#s-gallery::-webkit-scrollbar{display:none}
.empty-gallery{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text2);text-align:center;padding:40px 20px}
.empty-gallery .big-icon{font-size:52px}
.empty-gallery h3{font-size:17px;color:var(--text)}
.empty-gallery p{font-size:14px;line-height:1.5;max-width:240px}
.streak-bar{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.streak-fire{font-size:26px}
.streak-info{flex:1}
.streak-info strong{font-size:14px;display:block}
.streak-info span{font-size:12px;color:var(--text2)}
.streak-num{font-size:28px;font-weight:700;color:var(--accent)}
.day-block{flex-shrink:0}
.day-header{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.day-name{font-size:15px;font-weight:600}
.day-date{font-size:12px;color:var(--text2)}
.day-count{margin-left:auto;font-size:11px;color:var(--accent);background:var(--accent-dim);border-radius:8px;padding:2px 7px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:16px;overflow:hidden}
.photo-grid.solo{grid-template-columns:1fr}
.photo-grid.duo{grid-template-columns:repeat(2,1fr)}
.photo-thumb{aspect-ratio:1;position:relative;cursor:pointer;overflow:hidden;background:var(--surface)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .ph-time{position:absolute;bottom:5px;right:6px;font-size:10px;color:rgba(255,255,255,0.75);background:rgba(0,0,0,0.45);border-radius:5px;padding:1px 5px;font-weight:500}
/* VIEWER */
#viewer{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
#viewer.open{display:flex}
.viewer-top{padding:calc(var(--safe-top) + 8px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.viewer-close{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.12);border:none;cursor:pointer;font-size:18px;color:#fff;display:flex;align-items:center;justify-content:center}
.viewer-meta{text-align:right}
.viewer-meta .vm-time{font-size:13px;color:rgba(255,255,255,0.7)}
.viewer-meta .vm-date{font-size:11px;color:rgba(255,255,255,0.4)}
#viewer-img{flex:1;width:100%;object-fit:contain;display:block}
.viewer-bottom{padding:14px 20px calc(var(--safe-bottom) + 14px);background:rgba(0,0,0,0.6);backdrop-filter:blur(12px)}
.viewer-caption{font-size:14px;color:rgba(255,255,255,0.85);min-height:20px;line-height:1.4}
.viewer-actions{display:flex;gap:10px;margin-top:12px}
.va-btn{flex:1;padding:11px;border-radius:12px;border:none;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.va-btn.delete{background:rgba(255,59,48,0.15);color:#FF3B30}
.va-btn.share{background:var(--accent-dim);color:var(--accent)}
/* NAV */
.bottom-nav{display:flex;padding:8px 0 calc(var(--safe-bottom) + 6px);background:rgba(255,255,255,0.7);backdrop-filter:blur(10px);border-top:0.5px solid var(--border);flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav-icon{font-size:22px;color:var(--text3);transition:color .15s}
.nav-icon.active{color:var(--accent)}
.nav-label{font-size:10px;color:var(--text3);transition:color .15s}
.nav-label.active{color:var(--accent)}
.nav-cam-btn{width:50px;height:50px;border-radius:17px;background:linear-gradient(135deg,#0284c7,#a855f7);display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-12px;box-shadow:0 4px 16px rgba(2,132,199,0.35)}
/* CALENDAR POPUP */
.cal-modal{position:fixed;inset:0;z-index:300;background:rgba(7,89,133,0.35);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.cal-modal.open{display:flex}
.cal-sheet{background:var(--surface);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:18px 18px calc(var(--safe-bottom) + 18px);animation:calUp .22s ease}
@keyframes calUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--accent-dim);color:var(--accent);font-size:17px;cursor:pointer;font-family:inherit;line-height:1}
.cal-title{font-size:15px;font-weight:600;color:var(--text)}
.cal-streak-row{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.cal-streak-fire{font-size:20px}
.cal-streak-text{font-size:13px;color:var(--text2)}
.cal-streak-text strong{color:var(--accent);font-size:16px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text3);margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:12px;color:var(--text2)}
.cal-day.empty{visibility:hidden}
.cal-day.has-photo{background:var(--accent-dim);color:var(--text);font-weight:600}
.cal-day.streak-day{background:linear-gradient(135deg,#0284c7,#a855f7);color:#fff;font-weight:700}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-actions{display:flex;gap:10px;margin-top:16px}
.cal-view-btn{flex:1;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.cal-close-btn{padding:12px 18px;border-radius:12px;border:none;background:var(--surface2);color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.nav-icon svg{display:block}
/* TOAST */
#toast{position:fixed;bottom:calc(var(--safe-bottom) + 90px);left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,30,35,0.95);border:0.5px solid var(--border);border-radius:12px;padding:10px 18px;font-size:13px;color:var(--text);white-space:nowrap;opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;backdrop-filter:blur(12px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* INSTALL BANNER */
.install-banner{background:var(--surface);border:0.5px solid var(--accent-dim);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin:10px 14px 0;flex-shrink:0}
.install-banner .ib-icon{font-size:22px}
.install-banner .ib-text{flex:1;font-size:12px;color:var(--text2);line-height:1.4}
.install-banner .ib-close{font-size:18px;color:var(--text3);cursor:pointer;padding:4px}
</style>
</head>
<body>
<div id="flash"></div>
<div id="app">
  <div class="topbar">
    <div class="logo">T&amp;H<span>Spending</span></div>
    <div class="top-right">
      <button class="icon-btn" onclick="exportPhotos()">💾</button>
    </div>
  </div>

  <div id="install-banner" class="install-banner" style="display:none">
    <div class="ib-icon">📲</div>
    <div class="ib-text">Nhấn <b>Share</b> → <b>Add to Home Screen</b> để cài app lên iPhone!</div>
    <div class="ib-close" onclick="document.getElementById('install-banner').style.display='none'">✕</div>
  </div>

  <div class="tabbar">
    <div class="tab active" id="tab-camera" onclick="switchTab('camera')">Camera</div>
    <div class="tab" id="tab-gallery" onclick="switchTab('gallery')">Nhật ký</div>
  </div>

  <div class="screen active" id="s-camera">
    <div class="vf-wrap" id="vf-wrap"></div>
    <div class="shutter-row">
      <div class="thumb-preview" id="thumb-preview" onclick="switchTab('gallery')"><span>📁</span></div>
      <div class="shutter" id="shutter-btn" onclick="capturePhoto()">
        <div class="shutter-inner"></div>
      </div>
      <button class="flip-btn" id="flip-btn" onclick="flipCamera()">🔄</button>
    </div>
  </div>

  <div class="screen" id="s-gallery"></div>

  <div class="bottom-nav">
    <div class="nav-item" onclick="openCalendarPopup()">
      <div class="nav-icon" id="nav-gallery">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="4"></rect>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <line x1="8" y1="2.5" x2="8" y2="6.5"></line>
          <line x1="16" y1="2.5" x2="16" y2="6.5"></line>
          <circle cx="8" cy="14.5" r="1.3" fill="currentColor" stroke="none"></circle>
          <circle cx="12" cy="14.5" r="1.3" fill="currentColor" stroke="none"></circle>
          <circle cx="16" cy="14.5" r="1.3" fill="currentColor" stroke="none"></circle>
        </svg>
      </div>
      <div class="nav-label" id="navl-gallery">Nhật ký</div>
    </div>
    <div class="nav-item" onclick="switchTab('camera')">
      <div class="nav-cam-btn" id="nav-cam">📷</div>
    </div>
    <div class="nav-item" onclick="showStreakInfo()">
      <div class="nav-icon" id="nav-streak">🔥</div>
      <div class="nav-label" id="navl-streak">Streak</div>
    </div>
  </div>
</div>

<div id="calendar-modal" class="cal-modal">
  <div class="cal-sheet">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="changeCalMonth(-1)">‹</button>
      <div class="cal-title" id="cal-title"></div>
      <button class="cal-nav-btn" onclick="changeCalMonth(1)">›</button>
    </div>
    <div class="cal-streak-row">
      <div class="cal-streak-fire">🔥</div>
      <div class="cal-streak-text"><strong id="cal-streak-num">0</strong> ngày liên tiếp</div>
    </div>
    <div class="cal-weekdays"><span>CN</span><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-actions">
      <button class="cal-view-btn" onclick="goToGalleryFromCal()">Xem nhật ký đầy đủ</button>
      <button class="cal-close-btn" onclick="closeCalendarPopup()">Đóng</button>
    </div>
  </div>
</div>

<div id="viewer">
  <div class="viewer-top">
    <button class="viewer-close" onclick="closeViewer()">✕</button>
    <div class="viewer-meta">
      <div class="vm-time" id="vm-time"></div>
      <div class="vm-date" id="vm-date"></div>
    </div>
  </div>
  <img id="viewer-img" src="" alt="">
  <div class="viewer-bottom">
    <div class="viewer-caption" id="viewer-caption"></div>
    <div class="viewer-actions">
      <button class="va-btn share" onclick="sharePhoto()">Chia sẻ</button>
      <button class="va-btn delete" onclick="deletePhoto()">Xoá</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let photos=[],stream=null,facingMode='environment',currentViewerId=null;
const STORAGE_KEY='snapday_v2';

function savePhotos(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(photos))}catch(e){}}
function loadPhotos(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)photos=JSON.parse(r)}catch(e){photos=[]}}

// Show install banner on mobile Safari (not standalone)
window.addEventListener('load',()=>{
  const isSafari=/Safari/.test(navigator.userAgent)&&!/Chrome/.test(navigator.userAgent);
  const isStandalone=window.navigator.standalone;
  if(isSafari&&!isStandalone){
    document.getElementById('install-banner').style.display='flex';
  }
});

async function startCamera(){
  const wrap=document.getElementById('vf-wrap');

  // Check HTTPS
  if(location.protocol==='file:'){
    wrap.innerHTML=`<div class="no-cam">
      <div class="big-icon">🔒</div>
      <h3>Cần mở qua HTTPS</h3>
      <p>Safari iOS chặn camera với file local. Làm theo các bước:</p>
      <ol class="steps">
        <li>1. Vào <b>netlify.com/drop</b></li>
        <li>2. Kéo thả file <b>index.html</b> vào</li>
        <li>3. Copy link <b>https://xxx.netlify.app</b></li>
        <li>4. Mở link đó bằng Safari trên iPhone</li>
        <li>5. Share → Add to Home Screen</li>
      </ol>
    </div>`;
    return;
  }

  if(!navigator.mediaDevices?.getUserMedia){
    wrap.innerHTML=`<div class="no-cam">
      <div class="big-icon">📵</div>
      <h3>Trình duyệt không hỗ trợ</h3>
      <p>Dùng Safari trên iPhone để có camera.</p>
    </div>`;
    return;
  }

  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode,width:{ideal:1920},height:{ideal:1920}},audio:false
    });
    wrap.innerHTML=`
      <video id="video" autoplay playsinline muted></video>
      <div class="vf-overlay">
        <div class="vf-top">
          <div class="date-chip" id="date-chip"></div>
          <div class="vf-top-btns">
            <div class="vf-btn" id="flash-btn" onclick="toggleFlash(event)">⚡</div>
          </div>
        </div>
        <div class="vf-bottom">
          <input id="caption-input" type="text" placeholder="Thêm caption…" maxlength="80">
          <div class="zoom-row">
            <div class="zoom-pill" onclick="setZoom(0.5,this)">0.5×</div>
            <div class="zoom-pill active" onclick="setZoom(1,this)">1×</div>
            <div class="zoom-pill" onclick="setZoom(2,this)">2×</div>
          </div>
        </div>
      </div>`;
    document.getElementById('video').srcObject=stream;
    updateDateChip();
  }catch(err){
    console.log('Camera error:',err.name,err.message);
    let msg='Không thể truy cập camera.';
    if(err.name==='NotAllowedError')msg='Bạn đã từ chối quyền camera.<br>Vào Settings → Safari → Camera → Cho phép.';
    else if(err.name==='NotFoundError')msg='Không tìm thấy camera trên thiết bị.';
    wrap.innerHTML=`<div class="no-cam">
      <div class="big-icon">🔒</div>
      <h3>Không truy cập được camera</h3>
      <p>${msg}</p>
      <button class="allow-btn" onclick="startCamera()">Thử lại</button>
    </div>`;
  }
}

function updateDateChip(){
  const el=document.getElementById('date-chip');
  if(!el)return;
  const d=new Date();
  const days=['CN','T2','T3','T4','T5','T6','T7'];
  el.textContent=`${days[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}`;
}

let flashOn=false;
function toggleFlash(e){
  e.stopPropagation();
  flashOn=!flashOn;
  const btn=document.getElementById('flash-btn');
  if(btn)btn.style.color=flashOn?'#FFD60A':'#fff';
  if(stream){
    const track=stream.getVideoTracks()[0];
    if(track?.getCapabilities){
      const caps=track.getCapabilities();
      if(caps.torch)track.applyConstraints({advanced:[{torch:flashOn}]}).catch(()=>{});
    }
  }
}

function setZoom(level,el){
  document.querySelectorAll('.zoom-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  if(stream){
    const track=stream.getVideoTracks()[0];
    if(track?.getCapabilities){
      const caps=track.getCapabilities();
      if(caps.zoom){
        const z=Math.min(caps.zoom.max,Math.max(caps.zoom.min,level));
        track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
      }
    }
  }
}

function flipCamera(){
  const btn=document.getElementById('flip-btn');
  btn.style.transform='rotateY(180deg)';
  setTimeout(()=>btn.style.transform='',300);
  facingMode=facingMode==='user'?'environment':'user';
  startCamera();
}

function capturePhoto(){
  const video=document.getElementById('video');
  if(!video){showToast('Chưa bật camera');return;}
  const flash=document.getElementById('flash');
  flash.style.opacity='1';
  setTimeout(()=>flash.style.opacity='0',150);
  const canvas=document.createElement('canvas');
  const size=Math.min(video.videoWidth,video.videoHeight);
  if(!size){showToast('Camera chưa sẵn sàng');return;}
  canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');
  if(facingMode==='user'){ctx.translate(size,0);ctx.scale(-1,1);}
  const xOff=(video.videoWidth-size)/2;
  const yOff=(video.videoHeight-size)/2;
  ctx.drawImage(video,xOff,yOff,size,size,0,0,size,size);
  const dataUrl=canvas.toDataURL('image/jpeg',0.82);
  const captionEl=document.getElementById('caption-input');
  const caption=captionEl?captionEl.value.trim():'';
  if(captionEl)captionEl.value='';
  const now=new Date();
  const photo={id:Date.now().toString(),dataUrl,date:toDateStr(now),time:toTimeStr(now),caption};
  photos.unshift(photo);
  savePhotos();
  updateThumbPreview();
  showToast('Đã lưu! 📸');
}

function toDateStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toTimeStr(d){return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

function updateThumbPreview(){
  const p=document.getElementById('thumb-preview');
  if(!p)return;
  p.innerHTML=photos.length>0?`<img src="${photos[0].dataUrl}" alt="">`:'<span>📁</span>';
}

function renderGallery(){
  const el=document.getElementById('s-gallery');
  if(photos.length===0){
    el.innerHTML=`<div class="empty-gallery"><div class="big-icon">📷</div><h3>Chưa có ảnh nào</h3><p>Chụp ảnh đầu tiên ngay hôm nay!</p></div>`;
    return;
  }
  const groups={};
  photos.forEach(p=>{if(!groups[p.date])groups[p.date]=[];groups[p.date].push(p);});
  const streak=calcStreak();
  let html=`<div class="streak-bar"><div class="streak-fire">🔥</div><div class="streak-info"><strong>Chuỗi liên tiếp</strong><span>${streak>0?'Tiếp tục duy trì!':'Bắt đầu hôm nay!'}</span></div><div class="streak-num">${streak}</div></div>`;
  const today=toDateStr(new Date());
  const yesterday=toDateStr(new Date(Date.now()-86400000));
  Object.keys(groups).sort().reverse().forEach(date=>{
    const dayPhotos=groups[date];
    let label=date;
    if(date===today)label='Hôm nay';
    else if(date===yesterday)label='Hôm qua';
    else{const d=new Date(date+'T00:00:00');const days=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];label=days[d.getDay()];}
    const d=new Date(date+'T00:00:00');
    const dateLabel=`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
    const gc=dayPhotos.length===1?'solo':dayPhotos.length===2?'duo':'';
    const thumbs=dayPhotos.map(p=>`<div class="photo-thumb" onclick="openViewer('${p.id}')"><img src="${p.dataUrl}" alt="" loading="lazy"><div class="ph-time">${p.time}</div></div>`).join('');
    html+=`<div class="day-block"><div class="day-header"><div class="day-name">${label}</div><div class="day-date">${dateLabel}</div><div class="day-count">${dayPhotos.length} ảnh</div></div><div class="photo-grid ${gc}">${thumbs}</div></div>`;
  });
  el.innerHTML=html;
}

function calcStreak(){
  if(!photos.length)return 0;
  const dates=[...new Set(photos.map(p=>p.date))].sort().reverse();
  const today=toDateStr(new Date());
  const yesterday=toDateStr(new Date(Date.now()-86400000));
  if(dates[0]!==today&&dates[0]!==yesterday)return 0;
  let streak=0,check=today;
  for(const d of dates){
    if(d===check){streak++;const prev=new Date(check+'T00:00:00');prev.setDate(prev.getDate()-1);check=toDateStr(prev);}
    else if(d<check)break;
  }
  return streak;
}

function openViewer(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  currentViewerId=id;
  document.getElementById('viewer-img').src=p.dataUrl;
  document.getElementById('viewer-caption').textContent=p.caption||'';
  document.getElementById('vm-time').textContent=p.time;
  const d=new Date(p.date+'T00:00:00');
  document.getElementById('vm-date').textContent=`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  document.getElementById('viewer').classList.add('open');
}

function closeViewer(){document.getElementById('viewer').classList.remove('open');currentViewerId=null;}

function deletePhoto(){
  if(!currentViewerId)return;
  if(!confirm('Xoá ảnh này?'))return;
  photos=photos.filter(p=>p.id!==currentViewerId);
  savePhotos();closeViewer();renderGallery();updateThumbPreview();
  showToast('Đã xoá');
}

function sharePhoto(){
  const p=photos.find(x=>x.id===currentViewerId);if(!p)return;
  if(navigator.share){
    fetch(p.dataUrl).then(r=>r.blob()).then(blob=>{
      const file=new File([blob],'snapday.jpg',{type:'image/jpeg'});
      navigator.share({files:[file],title:'T&H Spending'}).catch(()=>{});
    });
  }else{
    const a=document.createElement('a');a.href=p.dataUrl;
    a.download=`snapday_${p.date}_${p.time.replace(':','')}.jpg`;a.click();
    showToast('Đang tải xuống…');
  }
}

function exportPhotos(){
  if(!photos.length){showToast('Chưa có ảnh');return;}
  showToast(`Đang xuất ${photos.length} ảnh…`);
  photos.forEach((p,i)=>setTimeout(()=>{const a=document.createElement('a');a.href=p.dataUrl;a.download=`snapday_${p.date}_${p.time.replace(':','')}.jpg`;a.click();},i*400));
}

function showStreakInfo(){
  const streak=calcStreak();
  const total=photos.length;
  const days=new Set(photos.map(p=>p.date)).size;
  showToast(`🔥 ${streak} ngày · 📷 ${total} ảnh · 📅 ${days} ngày có ảnh`);
}

let calMonthOffset=0;
function openCalendarPopup(){
  calMonthOffset=0;
  renderCalendar();
  document.getElementById('calendar-modal').classList.add('open');
}
function closeCalendarPopup(){
  document.getElementById('calendar-modal').classList.remove('open');
}
function changeCalMonth(delta){
  calMonthOffset+=delta;
  renderCalendar();
}
function goToGalleryFromCal(){
  closeCalendarPopup();
  switchTab('gallery');
}

function getStreakDates(){
  const streakDates=new Set();
  if(!photos.length)return streakDates;
  const dates=[...new Set(photos.map(p=>p.date))].sort().reverse();
  const today=toDateStr(new Date());
  const yesterday=toDateStr(new Date(Date.now()-86400000));
  if(dates[0]!==today&&dates[0]!==yesterday)return streakDates;
  let check=dates[0]===today?today:yesterday;
  for(const d of dates){
    if(d===check){
      streakDates.add(d);
      const prev=new Date(check+'T00:00:00');prev.setDate(prev.getDate()-1);
      check=toDateStr(prev);
    }else if(d<check)break;
  }
  return streakDates;
}

function renderCalendar(){
  const now=new Date();
  const base=new Date(now.getFullYear(),now.getMonth()+calMonthOffset,1);
  const year=base.getFullYear(),month=base.getMonth();
  const monthNames=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  document.getElementById('cal-title').textContent=`${monthNames[month]} ${year}`;

  const streak=calcStreak();
  document.getElementById('cal-streak-num').textContent=streak;

  const photoDates=new Set(photos.map(p=>p.date));
  const streakDates=getStreakDates();
  const todayStr=toDateStr(new Date());

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();

  let html='';
  for(let i=0;i<firstDay;i++)html+='<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls='cal-day';
    if(dateStr===todayStr)cls+=' today';
    if(streakDates.has(dateStr))cls+=' streak-day';
    else if(photoDates.has(dateStr))cls+=' has-photo';
    html+=`<div class="${cls}">${d}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}

function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('s-'+tab).classList.add('active');
  const tabEl=document.getElementById('tab-'+tab);
  if(tabEl)tabEl.classList.add('active');
  if(tab==='camera'){if(!stream)startCamera();}
  else if(tab==='gallery')renderGallery();
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

document.addEventListener('DOMContentLoaded',()=>{
  loadPhotos();updateThumbPreview();startCamera();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
});
</script>
</body>
</html>
