<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T&H Spending">
<meta name="theme-color" content="#0D0D0F">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon-192.png">
<title>T&H Spending</title>
<style>
:root{--bg:#f0f9ff;--surface:#ffffff;--surface2:#e0f2fe;--border:#bae6fd;--accent:#0284c7;--accent-dim:rgba(2,132,199,0.14);--text:#075985;--text2:#0369a1;--text3:#7dd3fc;--safe-top:env(safe-area-inset-top,44px);--safe-bottom:env(safe-area-inset-bottom,20px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 50%,#f3e8ff 100%);color:var(--text);font-family:'Be Vietnam Pro',-apple-system,sans-serif;overflow:hidden;position:fixed;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(2,132,199,0.12)}
.topbar{padding:calc(var(--safe-top) + 6px) 20px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:transparent}
.logo{font-size:20px;font-weight:700;letter-spacing:-0.5px;background:linear-gradient(135deg,#075985 0%,#0369a1 40%,#7e22ce 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo span{background:linear-gradient(135deg,#0369a1 0%,#a855f7 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.top-right{display:flex;gap:10px}
.icon-btn{width:36px;height:36px;border-radius:50%;background:var(--surface);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--text)}
.tabbar{display:flex;padding:0 20px;flex-shrink:0;border-bottom:0.5px solid var(--border);background:transparent}
.tab{font-size:14px;font-weight:500;color:var(--text3);padding:8px 16px 8px 0;cursor:pointer;position:relative;transition:color .2s}
.tab.active{color:var(--text)}
.tab.active::after{content:'';position:absolute;bottom:-0.5px;left:0;width:calc(100% - 16px);height:2px;background:var(--accent);border-radius:2px}
.screen{flex:1;overflow:hidden;display:none;flex-direction:column}
.screen.active{display:flex}
/* CAMERA */
#s-camera{padding:12px 14px;gap:12px}
.vf-wrap{flex:1;border-radius:24px;overflow:hidden;position:relative;background:#000;min-height:0}
#video{width:100%;height:100%;object-fit:cover;display:block}
.vf-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;pointer-events:none}
.vf-top{display:flex;justify-content:space-between;align-items:center;pointer-events:all}
.date-chip{background:rgba(0,0,0,0.55);border:0.5px solid rgba(255,255,255,0.12);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.88);backdrop-filter:blur(8px)}
.vf-top-btns{display:flex;gap:8px;pointer-events:all}
.vf-btn{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,0.5);border:0.5px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;backdrop-filter:blur(4px);color:#fff}
.vf-bottom{pointer-events:all}
#caption-input{width:100%;background:rgba(0,0,0,0.5);border:0.5px solid rgba(255,255,255,0.15);border-radius:14px;padding:9px 14px;font-size:13px;color:#fff;font-family:inherit;backdrop-filter:blur(8px);margin-bottom:10px;outline:none}
#caption-input::placeholder{color:rgba(255,255,255,0.35)}
.money-row{margin-bottom:10px}
.money-toggle{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,0.5);border:0.5px solid rgba(255,255,255,0.15);border-radius:20px;padding:7px 14px;font-size:12.5px;color:rgba(255,255,255,0.85);cursor:pointer;backdrop-filter:blur(8px);width:fit-content}
.money-toggle.active{background:linear-gradient(135deg,#0284c7,#a855f7);border-color:transparent;color:#fff;font-weight:600}
.money-fields{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.money-fields-row{display:flex;gap:8px}
.cat-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.cat-pills::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,0.5);border:0.5px solid rgba(255,255,255,0.15);border-radius:14px;padding:6px 10px;font-size:11.5px;color:rgba(255,255,255,0.75);cursor:pointer;backdrop-filter:blur(8px);white-space:nowrap;font-family:inherit}
.cat-pill.active{background:linear-gradient(135deg,#0284c7,#a855f7);border-color:transparent;color:#fff;font-weight:600}
.ph-cat-icon{position:absolute;top:5px;left:5px;font-size:14px;background:rgba(0,0,0,0.45);border-radius:8px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.viewer-cat{display:inline-block;margin-left:8px;font-size:12px;color:rgba(255,255,255,0.6)}
.money-type{display:flex;background:rgba(0,0,0,0.5);border-radius:12px;padding:3px;gap:2px;border:0.5px solid rgba(255,255,255,0.15);flex-shrink:0}
.money-type-btn{border:none;background:transparent;color:rgba(255,255,255,0.6);font-size:12.5px;padding:8px 12px;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:600}
.money-type-btn[data-type="expense"].active{background:#ef4444;color:#fff}
.money-type-btn[data-type="income"].active{background:#22c55e;color:#fff}
#amount-input{flex:1;min-width:0;background:rgba(0,0,0,0.5);border:0.5px solid rgba(255,255,255,0.15);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;color:#fff;font-family:inherit;backdrop-filter:blur(8px);outline:none}
#amount-input::placeholder{color:rgba(255,255,255,0.35);font-weight:400}
.ph-amount{position:absolute;left:5px;bottom:5px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;color:#fff;backdrop-filter:blur(4px)}
.ph-amount.expense{background:rgba(239,68,68,0.85)}
.ph-amount.income{background:rgba(34,197,94,0.85)}
.photo-thumb{position:relative}
.day-total{font-size:12px;font-weight:700;margin-left:auto}
.day-total.expense{color:#ef4444}
.day-total.income{color:#22c55e}
.day-total.mixed{color:var(--text2)}
.viewer-amount{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;padding:4px 12px;border-radius:10px;color:#fff}
.viewer-amount.expense{background:#ef4444}
.viewer-amount.income{background:#22c55e}
.zoom-row{display:flex;justify-content:center;gap:6px}
.zoom-pill{background:rgba(0,0,0,0.5);border:0.5px solid rgba(255,255,255,0.12);border-radius:20px;padding:4px 11px;font-size:12px;color:rgba(255,255,255,0.55);font-weight:500;cursor:pointer;backdrop-filter:blur(4px);transition:all .15s}
.zoom-pill.active{color:var(--accent);border-color:rgba(2,132,199,0.5)}
.shutter-row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0;flex-shrink:0}
.thumb-preview{width:48px;height:48px;border-radius:12px;border:2px solid var(--border);background:var(--surface);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text3)}
.thumb-preview img{width:100%;height:100%;object-fit:cover}
.shutter{width:72px;height:72px;border-radius:50%;border:3px solid var(--accent);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shutter-inner{width:58px;height:58px;border-radius:50%;background:#fff;transition:transform .1s ease}
.shutter:active .shutter-inner{transform:scale(0.88)}
.flip-btn{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .3s ease}
/* NO CAM */
.no-cam{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text2);text-align:center;padding:24px}
.no-cam .big-icon{font-size:52px}
.no-cam h3{font-size:18px;color:var(--text)}
.no-cam p{font-size:14px;line-height:1.6;max-width:280px;color:var(--text2)}
.no-cam .steps{text-align:left;background:var(--surface);border-radius:14px;padding:14px 16px;width:100%;max-width:300px}
.no-cam .steps li{font-size:13px;line-height:1.7;color:var(--text2);padding-left:4px}
.allow-btn{background:var(--accent);color:#fff;border:none;border-radius:14px;padding:13px 28px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
/* FLASH */
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:999;transition:opacity .08s}
/* GALLERY */
#s-gallery{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--safe-bottom) + 14px);gap:20px;align-items:stretch}
#s-gallery::-webkit-scrollbar{display:none}
.empty-gallery{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text2);text-align:center;padding:40px 20px}
.empty-gallery .big-icon{font-size:52px}
.empty-gallery h3{font-size:17px;color:var(--text)}
.empty-gallery p{font-size:14px;line-height:1.5;max-width:240px}
.streak-bar{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.streak-fire{font-size:26px}
.streak-info{flex:1}
.streak-info strong{font-size:14px;display:block}
.streak-info span{font-size:12px;color:var(--text2)}
.streak-num{font-size:28px;font-weight:700;color:var(--accent)}
.day-block{flex-shrink:0}
.day-header{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.day-name{font-size:15px;font-weight:600}
.day-date{font-size:12px;color:var(--text2)}
.day-count{margin-left:auto;font-size:11px;color:var(--accent);background:var(--accent-dim);border-radius:8px;padding:2px 7px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:16px;overflow:hidden}
.photo-grid.solo{grid-template-columns:1fr}
.photo-grid.duo{grid-template-columns:repeat(2,1fr)}
.photo-thumb{aspect-ratio:1;position:relative;cursor:pointer;overflow:hidden;background:var(--surface)}
.photo-thumb img{width:100%;height:100%;object-fit:contain;background:var(--surface2);display:block}
.photo-thumb .ph-time{position:absolute;bottom:5px;right:6px;font-size:10px;color:rgba(255,255,255,0.75);background:rgba(0,0,0,0.45);border-radius:5px;padding:1px 5px;font-weight:500}
/* VIEWER */
#viewer{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
#viewer.open{display:flex}
.viewer-top{padding:calc(var(--safe-top) + 8px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
.viewer-close{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.12);border:none;cursor:pointer;font-size:18px;color:#fff;display:flex;align-items:center;justify-content:center}
.viewer-meta{text-align:right}
.viewer-meta .vm-time{font-size:13px;color:rgba(255,255,255,0.7)}
.viewer-meta .vm-date{font-size:11px;color:rgba(255,255,255,0.4)}
.viewer-stage{flex:1;width:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
.viewer-stage img{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:transform .15s ease;will-change:transform;user-select:none}
.viewer-zoom-controls{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:5}
.vz-btn{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,0.55);border:0.5px solid rgba(255,255,255,0.15);color:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);font-family:inherit}
.vz-btn.vz-reset{font-size:11px;font-weight:600}
.viewer-bottom{padding:14px 20px calc(var(--safe-bottom) + 14px);background:rgba(0,0,0,0.6);backdrop-filter:blur(12px)}
.viewer-caption{font-size:14px;color:rgba(255,255,255,0.85);min-height:20px;line-height:1.4}
.viewer-actions{display:flex;gap:10px;margin-top:12px}
.va-btn{flex:1;padding:11px;border-radius:12px;border:none;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.va-btn.delete{background:rgba(255,59,48,0.15);color:#FF3B30}
.va-btn.share{background:var(--accent-dim);color:var(--accent)}
/* STATS */
#s-stats{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(var(--safe-bottom) + 14px);gap:16px;align-items:stretch}
#s-stats::-webkit-scrollbar{display:none}
.stats-month-nav{display:flex;align-items:center;justify-content:center;gap:16px;flex-shrink:0}
.stats-month-title{font-size:15px;font-weight:600;color:var(--text);min-width:120px;text-align:center}
.stats-summary{display:flex;gap:10px;flex-shrink:0}
.stats-card{flex:1;background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:14px 12px;text-align:center}
.stats-card .sc-label{font-size:11.5px;color:var(--text2);margin-bottom:4px}
.stats-card .sc-value{font-size:15px;font-weight:700}
.stats-card.expense .sc-value{color:#ef4444}
.stats-card.income .sc-value{color:#22c55e}
.stats-card.balance .sc-value{color:var(--accent)}
.budget-box{background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:14px 16px;flex-shrink:0}
.budget-box-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.budget-box-head strong{font-size:13.5px}
.budget-edit-link{font-size:12px;color:var(--accent);cursor:pointer;font-weight:600}
.budget-bar-track{width:100%;height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-bottom:6px}
.budget-bar-fill{height:100%;border-radius:6px;background:linear-gradient(135deg,#0284c7,#a855f7);transition:width .3s ease}
.budget-bar-fill.over{background:linear-gradient(135deg,#ef4444,#f97316)}
.budget-info{font-size:12px;color:var(--text2);display:flex;justify-content:space-between}
.budget-empty{font-size:12.5px;color:var(--text3)}
.cat-stats-title{font-size:13px;font-weight:600;color:var(--text);margin:2px 0 2px;flex-shrink:0}
.cat-stat-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:11px 14px;flex-shrink:0}
.cat-stat-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.cat-stat-body{flex:1;min-width:0}
.cat-stat-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.cat-stat-top .csn{font-weight:600;color:var(--text)}
.cat-stat-top .csv{font-weight:700;color:var(--text)}
.cat-stat-track{width:100%;height:6px;border-radius:4px;background:var(--surface2);overflow:hidden}
.cat-stat-fill{height:100%;border-radius:4px;background:linear-gradient(135deg,#0284c7,#a855f7)}
.stats-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text2);text-align:center;padding:40px 20px}
.stats-empty .big-icon{font-size:48px}
/* NAV */
.bottom-nav{display:flex;padding:8px 0 calc(var(--safe-bottom) + 6px);background:rgba(255,255,255,0.7);backdrop-filter:blur(10px);border-top:0.5px solid var(--border);flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav-icon{font-size:22px;color:var(--text3);transition:color .15s}
.nav-icon.active{color:var(--accent)}
.nav-label{font-size:10px;color:var(--text3);transition:color .15s}
.nav-label.active{color:var(--accent)}
.nav-cam-btn{width:50px;height:50px;border-radius:17px;background:linear-gradient(135deg,#0284c7,#a855f7);display:flex;align-items:center;justify-content:center;font-size:26px;margin-top:-12px;box-shadow:0 4px 16px rgba(2,132,199,0.35)}
/* CALENDAR POPUP */
.cal-modal{position:fixed;inset:0;z-index:300;background:rgba(7,89,133,0.35);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.cal-modal.open{display:flex}
.cal-sheet{background:var(--surface);width:100%;max-width:440px;border-radius:24px 24px 0 0;padding:18px 18px calc(var(--safe-bottom) + 18px);animation:calUp .22s ease}
@keyframes calUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--accent-dim);color:var(--accent);font-size:17px;cursor:pointer;font-family:inherit;line-height:1}
.cal-title{font-size:15px;font-weight:600;color:var(--text)}
.cal-streak-row{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.cal-streak-fire{font-size:20px}
.cal-streak-text{font-size:13px;color:var(--text2)}
.cal-streak-text strong{color:var(--accent);font-size:16px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--text3);margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-day{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;gap:3px}
.cal-day.empty{visibility:hidden}
.cal-day-num{font-size:11px;color:var(--text2);width:18px;height:18px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal-day.today .cal-day-num{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:700;color:var(--text)}
.cal-day.has-photo .cal-day-num{background:var(--accent-dim);color:var(--accent);font-weight:600}
.cal-day.streak-day .cal-day-num{background:linear-gradient(135deg,#0284c7,#a855f7);color:#fff;font-weight:700}
.cal-day-thumb-wrap{width:100%;flex:1;min-height:0;border-radius:7px;overflow:hidden;background:var(--surface2)}
.cal-day-thumb-wrap img{width:100%;height:100%;object-fit:contain;display:block}
.cal-day.has-photo,.cal-day.streak-day{cursor:pointer}
.cal-day.selected .cal-day-thumb-wrap{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day-photos{max-height:0;overflow:hidden;transition:max-height .25s ease}
.cal-day-photos.show{max-height:220px;margin-top:14px}
.cal-day-photos-header{font-size:13px;font-weight:600;color:var(--text);margin-bottom:8px}
.cal-day-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:180px;overflow-y:auto}
.cal-day-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;cursor:pointer;background:var(--surface2)}
.cal-day-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.cal-actions{display:flex;gap:10px;margin-top:16px}
.cal-view-btn{flex:1;padding:12px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.cal-close-btn{padding:12px 18px;border-radius:12px;border:none;background:var(--surface2);color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.nav-icon svg{display:block}
/* LOGIN */
.login-screen{position:fixed;inset:0;z-index:500;background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 50%,#f3e8ff 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.login-screen.hide{display:none}
.login-card{background:var(--surface);border-radius:24px;padding:36px 28px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(2,132,199,0.15)}
.login-logo{font-size:44px;margin-bottom:10px}
.login-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:10px}
.login-title span{color:var(--accent)}
.login-sub{font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:24px}
.login-google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;border-radius:14px;border:1px solid var(--border);background:#fff;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit}
/* FRIENDS */
#user-avatar-btn{overflow:hidden;padding:0}
#user-avatar-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.fr-me{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.fr-me img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.fr-me-info{font-size:13px;color:var(--text2)}
.fr-me-info strong{display:block;font-size:14px;color:var(--text)}
.fr-add-row{display:flex;gap:8px;margin-bottom:14px}
.fr-add-row input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--border);font-size:13px;font-family:inherit;background:var(--surface2);color:var(--text);outline:none}
.fr-add-row button{padding:11px 16px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
.fr-section-title{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;margin:14px 0 8px}
.fr-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border)}
.fr-row img{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--surface2)}
.fr-row-name{flex:1;font-size:13.5px;color:var(--text)}
.fr-row-name small{display:block;color:var(--text3);font-size:11px}
.fr-btn{padding:7px 12px;border-radius:10px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.fr-btn.accept{background:var(--accent);color:#fff}
.fr-btn.decline{background:var(--surface2);color:var(--text2)}
.fr-empty{font-size:12.5px;color:var(--text3);padding:6px 0}
/* TOAST */
#toast{position:fixed;bottom:calc(var(--safe-bottom) + 90px);left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,30,35,0.95);border:0.5px solid var(--border);border-radius:12px;padding:10px 18px;font-size:13px;color:var(--text);white-space:nowrap;opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;backdrop-filter:blur(12px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* INSTALL BANNER */
.install-banner{background:var(--surface);border:0.5px solid var(--accent-dim);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin:10px 14px 0;flex-shrink:0}
.install-banner .ib-icon{font-size:22px}
.install-banner .ib-text{flex:1;font-size:12px;color:var(--text2);line-height:1.4}
.install-banner .ib-close{font-size:18px;color:var(--text3);cursor:pointer;padding:4px}
</style>
</head>

async function startCamera(){
  const wrap=document.getElementById('vf-wrap');

  // Check HTTPS
  if(location.protocol==='file:'){
    wrap.innerHTML=`<div class="no-cam">
      <div class="big-icon">🔒</div>
      <h3>Cần mở qua HTTPS</h3>
      <p>Safari iOS chặn camera với file local. Làm theo các bước:</p>
      <ol class="steps">
        <li>1. Vào <b>netlify.com/drop</b></li>
        <li>2. Kéo thả file <b>index.html</b> vào</li>
        <li>3. Copy link <b>https://xxx.netlify.app</b></li>
        <li>4. Mở link đó bằng Safari trên iPhone</li>
        <li>5. Share → Add to Home Screen</li>
      </ol>
    </div>`;
    return;
  }

  if(!navigator.mediaDevices?.getUserMedia){
    wrap.innerHTML=`<div class="no-cam">
      <div class="big-icon">📵</div>
      <h3>Trình duyệt không hỗ trợ</h3>
      <p>Dùng Safari trên iPhone để có camera.</p>
    </div>`;
    return;
  }

  try{
    if(stream)stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode,width:{ideal:1920},height:{ideal:1920}},audio:false
    });
    wrap.innerHTML=`
      <video id="video" autoplay playsinline muted></video>
      <div class="vf-overlay">
        <div class="vf-top">
          <div class="date-chip" id="date-chip"></div>
          <div class="vf-top-btns">
            <div class="vf-btn" id="flash-btn" onclick="toggleFlash(event)">⚡</div>
          </div>
        </div>
        <div class="vf-bottom">
          <div class="money-row">
            <div class="money-toggle" id="money-toggle" onclick="toggleMoneyRow()">💰 Thêm chi tiêu</div>
            <div class="money-fields" id="money-fields" style="display:none">
              <div class="money-fields-row">
                <div class="money-type">
                  <button type="button" class="money-type-btn active" data-type="expense" onclick="setMoneyType('expense',this)">Chi</button>
                  <button type="button" class="money-type-btn" data-type="income" onclick="setMoneyType('income',this)">Thu</button>
                </div>
                <input id="amount-input" type="number" inputmode="numeric" placeholder="Số tiền (đ)">
              </div>
              <div class="cat-pills" id="cat-pills"></div>
            </div>
          </div>
          <input id="caption-input" type="text" placeholder="Thêm caption…" maxlength="80">
          <div class="zoom-row">
            <div class="zoom-pill" onclick="setZoom(0.5,this)">0.5×</div>
            <div class="zoom-pill active" onclick="setZoom(1,this)">1×</div>
            <div class="zoom-pill" onclick="setZoom(2,this)">2×</div>
          </div>
        </div>
      </div>`;
    document.getElementById('video').srcObject=stream;
    updateDateChip();
  }catch(err){
    console.log('Camera error:',err.name,err.message);
    let msg='Không thể truy cập camera.';
    if(err.name==='NotAllowedError')msg='Bạn đã từ chối quyền camera.<br>Vào Settings → Safari → Camera → Cho phép.';
    else if(err.name==='NotFoundError')msg='Không tìm thấy camera trên thiết bị.';
    wrap.innerHTML=`<div class="no-cam">
      <div class="big-icon">🔒</div>
      <h3>Không truy cập được camera</h3>
      <p>${msg}</p>
      <button class="allow-btn" onclick="startCamera()">Thử lại</button>
    </div>`;
  }
}

function updateDateChip(){
  const el=document.getElementById('date-chip');
  if(!el)return;
  const d=new Date();
  const days=['CN','T2','T3','T4','T5','T6','T7'];
  el.textContent=`${days[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}`;
}

let flashOn=false;
function toggleFlash(e){
  e.stopPropagation();
  flashOn=!flashOn;
  const btn=document.getElementById('flash-btn');
  if(btn)btn.style.color=flashOn?'#FFD60A':'#fff';
  if(stream){
    const track=stream.getVideoTracks()[0];
    if(track?.getCapabilities){
      const caps=track.getCapabilities();
      if(caps.torch)track.applyConstraints({advanced:[{torch:flashOn}]}).catch(()=>{});
    }
  }
}

function setZoom(level,el){
  document.querySelectorAll('.zoom-pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  if(stream){
    const track=stream.getVideoTracks()[0];
    if(track?.getCapabilities){
      const caps=track.getCapabilities();
      if(caps.zoom){
        const z=Math.min(caps.zoom.max,Math.max(caps.zoom.min,level));
        track.applyConstraints({advanced:[{zoom:z}]}).catch(()=>{});
      }
    }
  }
}

function flipCamera(){
  const btn=document.getElementById('flip-btn');
  btn.style.transform='rotateY(180deg)';
  setTimeout(()=>btn.style.transform='',300);
  facingMode=facingMode==='user'?'environment':'user';
  startCamera();
}

const EXPENSE_CATS=[
  {id:'an-uong',icon:'🍔',label:'Ăn uống'},
  {id:'di-chuyen',icon:'🚗',label:'Di chuyển'},
  {id:'mua-sam',icon:'🛍️',label:'Mua sắm'},
  {id:'hoa-don',icon:'🧾',label:'Hoá đơn'},
  {id:'giai-tri',icon:'🎮',label:'Giải trí'},
  {id:'suc-khoe',icon:'💊',label:'Sức khoẻ'},
  {id:'khac',icon:'📦',label:'Khác'}
];
const INCOME_CATS=[
  {id:'luong',icon:'💵',label:'Lương'},
  {id:'thuong',icon:'🎁',label:'Thưởng'},
  {id:'khac-thu',icon:'📦',label:'Khác'}
];
function getCatList(type){return type==='income'?INCOME_CATS:EXPENSE_CATS;}
function getCatInfo(type,catId){
  const list=getCatList(type);
  return list.find(c=>c.id===catId)||list[list.length-1];
}
let moneyType='expense',moneyRowOpen=false,selectedCategory='khac';
function renderCatPills(){
  const wrap=document.getElementById('cat-pills');
  if(!wrap)return;
  const list=getCatList(moneyType);
  if(!list.find(c=>c.id===selectedCategory))selectedCategory=list[list.length-1].id;
  wrap.innerHTML=list.map(c=>`<div class="cat-pill${c.id===selectedCategory?' active':''}" onclick="selectCategory('${c.id}')">${c.icon} ${c.label}</div>`).join('');
}
function selectCategory(id){
  selectedCategory=id;
  document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));
  renderCatPills();
}
function toggleMoneyRow(){
  moneyRowOpen=!moneyRowOpen;
  const fields=document.getElementById('money-fields');
  const toggle=document.getElementById('money-toggle');
  if(fields)fields.style.display=moneyRowOpen?'flex':'none';
  if(toggle)toggle.classList.toggle('active',moneyRowOpen);
  if(moneyRowOpen){renderCatPills();const inp=document.getElementById('amount-input');if(inp)setTimeout(()=>inp.focus(),50);}
}
function setMoneyType(type,el){
  moneyType=type;
  document.querySelectorAll('.money-type-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  selectedCategory=getCatList(type)[getCatList(type).length-1].id;
  renderCatPills();
}
function formatVND(n){return Number(n).toLocaleString('vi-VN')+'đ';}
function resetMoneyRow(){
  moneyRowOpen=false;moneyType='expense';selectedCategory='khac';
  const fields=document.getElementById('money-fields');
  const toggle=document.getElementById('money-toggle');
  const amountEl=document.getElementById('amount-input');
  if(fields)fields.style.display='none';
  if(toggle)toggle.classList.remove('active');
  if(amountEl)amountEl.value='';
  document.querySelectorAll('.money-type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type==='expense'));
}

function capturePhoto(){
  const video=document.getElementById('video');
  if(!video){showToast('Chưa bật camera');return;}
  const flash=document.getElementById('flash');
  flash.style.opacity='1';
  setTimeout(()=>flash.style.opacity='0',150);
  const canvas=document.createElement('canvas');
  const size=Math.min(video.videoWidth,video.videoHeight);
  if(!size){showToast('Camera chưa sẵn sàng');return;}
  canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');
  if(facingMode==='user'){ctx.translate(size,0);ctx.scale(-1,1);}
  const xOff=(video.videoWidth-size)/2;
  const yOff=(video.videoHeight-size)/2;
  ctx.drawImage(video,xOff,yOff,size,size,0,0,size,size);
  const dataUrl=canvas.toDataURL('image/jpeg',0.82);
  const captionEl=document.getElementById('caption-input');
  const caption=captionEl?captionEl.value.trim():'';
  if(captionEl)captionEl.value='';
  const amountEl=document.getElementById('amount-input');
  const amountRaw=amountEl?amountEl.value.replace(/[^\d]/g,''):'';
  const amount=amountRaw?parseInt(amountRaw,10):0;
  const finalMoneyType=amount>0?moneyType:null;
  const finalCategory=amount>0?selectedCategory:null;
  resetMoneyRow();
  const now=new Date();
  const id=Date.now().toString();
  const photo={id,dataUrl,date:toDateStr(now),time:toTimeStr(now),caption,amount,moneyType:finalMoneyType,category:finalCategory,ownerUid:currentUser?currentUser.uid:null,ownerName:currentUser?(currentUser.displayName||currentUser.email):null,cloud:false};
  photos.unshift(photo);
  savePhotos();
  updateThumbPreview();
  if(document.getElementById('s-gallery').classList.contains('active'))renderGallery();
  showToast(amount>0?`Đã lưu! 📸 ${finalMoneyType==='expense'?'-':'+'}${formatVND(amount)}`:'Đã lưu! 📸');
  if(currentUser)uploadPhotoToCloud(photo);
  else showToast('Chưa đăng nhập — ảnh chỉ lưu trên máy này');
}

async function uploadPhotoToCloud(photo){
  try{
    const blob=await(await fetch(photo.dataUrl)).blob();
    const ref=storage.ref().child(`photos/${currentUser.uid}/${photo.id}.jpg`);
    await ref.put(blob);
    const url=await ref.getDownloadURL();
    await db.collection('photos').doc(photo.id).set({
      ownerUid:currentUser.uid,
      ownerName:currentUser.displayName||currentUser.email,
      ownerEmail:currentUser.email,
      date:photo.date,time:photo.time,caption:photo.caption||'',
      amount:photo.amount||0,moneyType:photo.moneyType||null,category:photo.category||null,
      url,createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    const p=photos.find(x=>x.id===photo.id);
    if(p){p.cloud=true;savePhotos();}
  }catch(e){
    console.error(e);
    showToast('Lỗi tải ảnh lên cloud, ảnh vẫn còn trên máy');
  }
}

function toDateStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toTimeStr(d){return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

function renderGallery(){
  const el=document.getElementById('s-gallery');
  if(photos.length===0){
    el.innerHTML=`<div class="empty-gallery"><div class="big-icon">📷</div><h3>Chưa có ảnh nào</h3><p>Chụp ảnh đầu tiên ngay hôm nay!</p></div>`;
    return;
  }
  const groups={};
  photos.forEach(p=>{if(!groups[p.date])groups[p.date]=[];groups[p.date].push(p);});
  const streak=calcStreak();
  let html=`<div class="streak-bar"><div class="streak-fire">🔥</div><div class="streak-info"><strong>Chuỗi liên tiếp</strong><span>${streak>0?'Tiếp tục duy trì!':'Bắt đầu hôm nay!'}</span></div><div class="streak-num">${streak}</div></div>`;
  const today=toDateStr(new Date());
  const yesterday=toDateStr(new Date(Date.now()-86400000));
  Object.keys(groups).sort().reverse().forEach(date=>{
    const dayPhotos=groups[date];
    let label=date;
    if(date===today)label='Hôm nay';
    else if(date===yesterday)label='Hôm qua';
    else{const d=new Date(date+'T00:00:00');const days=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];label=days[d.getDay()];}
    const d=new Date(date+'T00:00:00');
    const dateLabel=`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
    const gc=dayPhotos.length===1?'solo':dayPhotos.length===2?'duo':'';
    const thumbs=dayPhotos.map(p=>{
      const badge=p.amount>0?`<div class="ph-amount ${p.moneyType}">${p.moneyType==='expense'?'-':'+'}${formatVND(p.amount)}</div>`:'';
      const catIcon=(p.amount>0&&p.category)?`<div class="ph-cat-icon">${getCatInfo(p.moneyType,p.category).icon}</div>`:'';
      return`<div class="photo-thumb" onclick="openViewer('${p.id}')"><img src="${p.dataUrl}" alt="" loading="lazy"><div class="ph-time">${p.time}</div>${catIcon}${badge}</div>`;
    }).join('');
    const dayExpense=dayPhotos.filter(p=>p.moneyType==='expense').reduce((s,p)=>s+(p.amount||0),0);
    const dayIncome=dayPhotos.filter(p=>p.moneyType==='income').reduce((s,p)=>s+(p.amount||0),0);
    const net=dayIncome-dayExpense;
    let totalHtml='';
    if(dayExpense>0||dayIncome>0){
      const cls=net>0?'income':net<0?'expense':'mixed';
      totalHtml=`<div class="day-total ${cls}">${net>0?'+':''}${net!==0?formatVND(net):'0đ'}</div>`;
    }
    html+=`<div class="day-block"><div class="day-header"><div class="day-name">${label}</div><div class="day-date">${dateLabel}</div>${totalHtml}<div class="day-count">${dayPhotos.length} ảnh</div></div><div class="photo-grid ${gc}">${thumbs}</div></div>`;
  });
  el.innerHTML=html;
}

function calcStreak(){
  if(!photos.length)return 0;
  const dates=[...new Set(photos.map(p=>p.date))].sort().reverse();
  const today=toDateStr(new Date());
  const yesterday=toDateStr(new Date(Date.now()-86400000));
  if(dates[0]!==today&&dates[0]!==yesterday)return 0;
  let streak=0,check=today;
  for(const d of dates){
    if(d===check){streak++;const prev=new Date(check+'T00:00:00');prev.setDate(prev.getDate()-1);check=toDateStr(prev);}
    else if(d<check)break;
  }
  return streak;
}

// ====== VIEWER ZOOM / PAN ======
let viewerZoom=1,viewerPanX=0,viewerPanY=0;
const VZ_MIN=1,VZ_MAX=4;
let vPointers=new Map(),vStartDist=0,vStartZoom=1,vDragging=false,vDragStart=null,vPanStart=null,vLastTap=0;

function applyViewerTransform(){
  const img=document.getElementById('viewer-img');
  if(!img)return;
  img.style.transform=`translate(${viewerPanX}px,${viewerPanY}px) scale(${viewerZoom})`;
  img.style.cursor=viewerZoom>1?'grab':'default';
  const resetBtn=document.getElementById('vz-reset-btn');
  if(resetBtn)resetBtn.textContent=viewerZoom.toFixed(1).replace('.0','')+'×';
}
function viewerZoomIn(){viewerZoom=Math.min(VZ_MAX,Math.round((viewerZoom+0.5)*10)/10);applyViewerTransform();}
function viewerZoomOut(){
  viewerZoom=Math.max(VZ_MIN,Math.round((viewerZoom-0.5)*10)/10);
  if(viewerZoom<=1){viewerZoom=1;viewerPanX=0;viewerPanY=0;}
  applyViewerTransform();
}
function viewerZoomReset(){
  viewerZoom=1;viewerPanX=0;viewerPanY=0;vPointers=new Map();vStartDist=0;vDragging=false;
  applyViewerTransform();
}
function viewerPointerDown(e){
  const stage=document.getElementById('viewer-stage');
  try{stage.setPointerCapture(e.pointerId);}catch(err){}
  vPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(vPointers.size===2){
    const pts=[...vPointers.values()];
    vStartDist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    vStartZoom=viewerZoom;
    vDragging=false;
  }else if(vPointers.size===1){
    const now=Date.now();
    if(now-vLastTap<300){
      if(viewerZoom>1)viewerZoomReset();
      else{viewerZoom=2.5;applyViewerTransform();}
      vLastTap=0;
      return;
    }
    vLastTap=now;
    vDragging=viewerZoom>1;
    vDragStart={x:e.clientX,y:e.clientY};
    vPanStart={x:viewerPanX,y:viewerPanY};
  }
}
function viewerPointerMove(e){
  if(!vPointers.has(e.pointerId))return;
  vPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(vPointers.size===2){
    const pts=[...vPointers.values()];
    const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    if(vStartDist>0){
      viewerZoom=Math.min(VZ_MAX,Math.max(VZ_MIN,Math.round(vStartZoom*(dist/vStartDist)*10)/10));
      applyViewerTransform();
    }
  }else if(vDragging&&vPointers.size===1){
    const p=[...vPointers.values()][0];
    viewerPanX=vPanStart.x+(p.x-vDragStart.x);
    viewerPanY=vPanStart.y+(p.y-vDragStart.y);
    applyViewerTransform();
  }
}
function viewerPointerUp(e){
  vPointers.delete(e.pointerId);
  if(vPointers.size<2)vStartDist=0;
  vDragging=false;
  if(viewerZoom<=1){viewerPanX=0;viewerPanY=0;applyViewerTransform();}
}

function getStreakDates(){
  const streakDates=new Set();
  if(!photos.length)return streakDates;
  const dates=[...new Set(photos.map(p=>p.date))].sort().reverse();
  const today=toDateStr(new Date());
  const yesterday=toDateStr(new Date(Date.now()-86400000));
  if(dates[0]!==today&&dates[0]!==yesterday)return streakDates;
  let check=dates[0]===today?today:yesterday;
  for(const d of dates){
    if(d===check){
      streakDates.add(d);
      const prev=new Date(check+'T00:00:00');prev.setDate(prev.getDate()-1);
      check=toDateStr(prev);
    }else if(d<check)break;
  }
  return streakDates;
}

function renderCalendar(){
  const now=new Date();
  const base=new Date(now.getFullYear(),now.getMonth()+calMonthOffset,1);
  const year=base.getFullYear(),month=base.getMonth();
  const monthNames=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  document.getElementById('cal-title').textContent=`${monthNames[month]} ${year}`;

  const streak=calcStreak();
  document.getElementById('cal-streak-num').textContent=streak;

  const monthPhotos=photos.filter(p=>p.date.startsWith(`${year}-${String(month+1).padStart(2,'0')}`));
  const monthExpense=monthPhotos.filter(p=>p.moneyType==='expense').reduce((s,p)=>s+(p.amount||0),0);
  const monthIncome=monthPhotos.filter(p=>p.moneyType==='income').reduce((s,p)=>s+(p.amount||0),0);
  const moneyText=document.getElementById('cal-money-text');
  if(monthExpense>0||monthIncome>0){
    let parts=[];
    if(monthExpense>0)parts.push(`<span style="color:#ef4444">-${formatVND(monthExpense)}</span>`);
    if(monthIncome>0)parts.push(`<span style="color:#22c55e">+${formatVND(monthIncome)}</span>`);
    moneyText.innerHTML=parts.join(' · ');
  }else{
    moneyText.textContent='Chưa có chi tiêu tháng này';
  }

  const photoDates=new Set(photos.map(p=>p.date));
  const streakDates=getStreakDates();
  const todayStr=toDateStr(new Date());

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();

  let html='';
  for(let i=0;i<firstDay;i++)html+='<div class="cal-day empty"></div>';
  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasPhoto=photoDates.has(dateStr);
    const isStreak=streakDates.has(dateStr);
    let cls='cal-day';
    if(dateStr===todayStr)cls+=' today';
    if(isStreak)cls+=' streak-day';
    else if(hasPhoto)cls+=' has-photo';
    if(selectedCalDate===dateStr)cls+=' selected';
    const clickAttr=hasPhoto?` onclick="selectCalDay('${dateStr}')"`:'';
    let thumb='<div class="cal-day-thumb-wrap"></div>';
    if(hasPhoto){
      const dayPhoto=photos.find(p=>p.date===dateStr);
      thumb=`<div class="cal-day-thumb-wrap"><img src="${dayPhoto.dataUrl}" alt="" loading="lazy"></div>`;
    }
    html+=`<div class="${cls}"${clickAttr}><div class="cal-day-num">${d}</div>${thumb}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
  renderCalDayPhotos();
}

function selectCalDay(dateStr){
  selectedCalDate=selectedCalDate===dateStr?null:dateStr;
  renderCalendar();
}

function renderCalDayPhotos(){
  const el=document.getElementById('cal-day-photos');
  if(!selectedCalDate){el.classList.remove('show');el.innerHTML='';return;}
  const dayPhotos=photos.filter(p=>p.date===selectedCalDate);

// ====== FRIENDS ======
function pairKey(a,b){return[a,b].sort().join('_');}

async function sendFriendRequestFromInput(){
  const input=document.getElementById('fr-email-input');
  const email=input.value.trim().toLowerCase();
  if(!email)return;
  if(currentUser&&email===currentUser.email.toLowerCase()){showToast('Không thể tự kết bạn với chính mình');return;}
  const snap=await db.collection('users').where('email','==',email).limit(1).get();
  if(snap.empty){showToast('Chưa tìm thấy người dùng — họ cần đăng nhập app ít nhất 1 lần');return;}
  const toUid=snap.docs[0].id;
  const key=pairKey(currentUser.uid,toUid);
  const existing=await db.collection('friendRequests').where('pairKey','==',key).limit(1).get();
  if(!existing.empty){showToast('Đã có lời mời giữa hai người rồi');return;}
  await db.collection('friendRequests').add({
    fromUid:currentUser.uid,fromEmail:currentUser.email,fromName:currentUser.displayName||currentUser.email,fromPhoto:currentUser.photoURL||'',
    toUid,toEmail:email,pairKey:key,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  input.value='';
  showToast('Đã gửi lời mời kết bạn');
}

async function respondFriendRequest(reqId,accept){
  await db.collection('friendRequests').doc(reqId).update({status:accept?'accepted':'declined'});
  showToast(accept?'Đã chấp nhận kết bạn':'Đã từ chối lời mời');
}

function listenFriends(){
  reqUnsubIn=db.collection('friendRequests').where('toUid','==',currentUser.uid).where('status','==','pending')
    .onSnapshot(snap=>{incomingRequests=snap.docs.map(d=>({id:d.id,...d.data()}));renderFriendsUI();},()=>{});
  const acceptedA={a:[]},acceptedB={b:[]};
  reqUnsubOutA=db.collection('friendRequests').where('fromUid','==',currentUser.uid).where('status','in',['pending','accepted'])
    .onSnapshot(snap=>{
      outgoingRequests=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.status==='pending');
      const acc=snap.docs.map(d=>d.data()).filter(r=>r.status==='accepted').map(r=>r.toUid);
      acceptedA.a=acc;updateFriendUids([...acceptedA.a,...(acceptedB.b||[])]);
    },()=>{});
  reqUnsubOutB=db.collection('friendRequests').where('toUid','==',currentUser.uid).where('status','==','accepted')
    .onSnapshot(snap=>{
      const acc=snap.docs.map(d=>d.data()).map(r=>r.fromUid);
      acceptedB.b=acc;updateFriendUids([...(acceptedA.a||[]),...acceptedB.b]);
    },()=>{});
}

      });

      listEl.innerHTML='<div class="fr-section-title">Bạn bè</div><div class="fr-empty">Chưa có bạn bè nào được xác nhận</div>';
    }
  }
}

// ====== CLOUD PHOTOS ======
function subscribeCloudPhotos(){
  if(photosUnsub){photosUnsub();photosUnsub=null;}
  if(!friendUids.length)return;
  photosUnsub=db.collection('photos').where('ownerUid','in',friendUids.slice(0,10))
    .onSnapshot(snap=>{
      cloudPhotosCache=snap.docs.map(d=>{
        const p=d.data();
        return{id:d.id,dataUrl:p.url,date:p.date,time:p.time,caption:p.caption||'',amount:p.amount||0,moneyType:p.moneyType||null,category:p.category||null,ownerUid:p.ownerUid,ownerName:p.ownerName,cloud:true};
      });
      mergePhotos();
    },e=>console.error(e));
}

function mergePhotos(){
  const map=new Map();
  localLegacyPhotos.forEach(p=>map.set(p.id,p));
  photos.filter(p=>!p.cloud&&p.ownerUid&&currentUser&&p.ownerUid===currentUser.uid).forEach(p=>{if(!map.has(p.id))map.set(p.id,p);});
  cloudPhotosCache.forEach(p=>map.set(p.id,p));
  photos=Array.from(map.values()).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  updateThumbPreview();
  if(document.getElementById('s-gallery').classList.contains('active'))renderGallery();
  if(document.getElementById('calendar-modal').classList.contains('open'))renderCalendar();
  if(document.getElementById('s-stats').classList.contains('active'))renderStats();
}

function switchTab(tab){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('s-'+tab).classList.add('active');
  const tabEl=document.getElementById('tab-'+tab);
  if(tabEl)tabEl.classList.add('active');
  if(tab==='camera'){if(!stream)startCamera();}
  else if(tab==='gallery')renderGallery();
  else if(tab==='stats')renderStats();
}

// ====== BUDGET ======
const BUDGET_KEY='th_budget_v1';
function getBudgets(){try{return JSON.parse(localStorage.getItem(BUDGET_KEY)||'{}')}catch(e){return{}}}
function setBudgetForMonth(monthKey,amount){
  const b=getBudgets();b[monthKey]=amount;
  try{localStorage.setItem(BUDGET_KEY,JSON.stringify(b))}catch(e){}
}
function editBudget(monthKey){
  const current=getBudgets()[monthKey]||'';
  const val=prompt('Đặt ngân sách chi tiêu cho tháng này (đ):',current||'');
  if(val===null)return;
  const num=parseInt(val.replace(/[^\d]/g,''),10);
  setBudgetForMonth(monthKey,isNaN(num)?0:num);
  renderStats();
}

// ====== STATS ======
let statsMonthOffset=0;
function changeStatsMonth(delta){statsMonthOffset+=delta;renderStats();}
function renderStats(){
  const el=document.getElementById('s-stats');
  if(!el)return;
  const now=new Date();
  const base=new Date(now.getFullYear(),now.getMonth()+statsMonthOffset,1);
  const year=base.getFullYear(),month=base.getMonth();
  const monthNames=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  const monthKey=`${year}-${String(month+1).padStart(2,'0')}`;
  const monthPhotos=photos.filter(p=>p.date.startsWith(monthKey));
  const expensePhotos=monthPhotos.filter(p=>p.moneyType==='expense'&&p.amount>0);
  const incomePhotos=monthPhotos.filter(p=>p.moneyType==='income'&&p.amount>0);
  const totalExpense=expensePhotos.reduce((s,p)=>s+p.amount,0);
  const totalIncome=incomePhotos.reduce((s,p)=>s+p.amount,0);
  const balance=totalIncome-totalExpense;

  let html=`<div class="stats-month-nav">
    <button class="cal-nav-btn" onclick="changeStatsMonth(-1)">‹</button>
    <div class="stats-month-title">${monthNames[month]} ${year}</div>
    <button class="cal-nav-btn" onclick="changeStatsMonth(1)">›</button>
  </div>`;

  html+=`<div class="stats-summary">
    <div class="stats-card income"><div class="sc-label">Thu nhập</div><div class="sc-value">+${formatVND(totalIncome)}</div></div>
    <div class="stats-card expense"><div class="sc-label">Chi tiêu</div><div class="sc-value">-${formatVND(totalExpense)}</div></div>
    <div class="stats-card balance"><div class="sc-label">Số dư</div><div class="sc-value">${balance>=0?'+':''}${formatVND(balance)}</div></div>
  </div>`;

  const budget=getBudgets()[monthKey]||0;
  if(budget>0){
    const pct=Math.min(100,Math.round((totalExpense/budget)*100));
    const over=totalExpense>budget;
    html+=`<div class="budget-box">
      <div class="budget-box-head"><strong>Ngân sách tháng</strong><span class="budget-edit-link" onclick="editBudget('${monthKey}')">Sửa</span></div>
      <div class="budget-bar-track"><div class="budget-bar-fill${over?' over':''}" style="width:${pct}%"></div></div>
      <div class="budget-info"><span>${over?'Đã vượt ngân sách!':`Đã dùng ${pct}%`}</span><span>${formatVND(totalExpense)} / ${formatVND(budget)}</span></div>
    </div>`;
  }else{
    html+=`<div class="budget-box">
      <div class="budget-box-head"><strong>Ngân sách tháng</strong><span class="budget-edit-link" onclick="editBudget('${monthKey}')">Đặt ngay</span></div>
      <div class="budget-empty">Chưa đặt ngân sách cho tháng này</div>
    </div>`;
  }

  if(expensePhotos.length){
    const byCat={};
    expensePhotos.forEach(p=>{
      const cid=p.category||'khac';
      byCat[cid]=(byCat[cid]||0)+p.amount;
    });
    const rows=Object.keys(byCat).map(cid=>({cid,total:byCat[cid]})).sort((a,b)=>b.total-a.total);
    const maxVal=rows[0].total;
    html+=`<div class="cat-stats-title">Chi tiêu theo danh mục</div>`;
    rows.forEach(r=>{
      const info=getCatInfo('expense',r.cid);
      const pct=Math.round((r.total/maxVal)*100);
      const share=totalExpense>0?Math.round((r.total/totalExpense)*100):0;
      html+=`<div class="cat-stat-row">
        <div class="cat-stat-icon">${info.icon}</div>
        <div class="cat-stat-body">
          <div class="cat-stat-top"><span class="csn">${info.label} <span style="color:var(--text3);font-weight:400">(${share}%)</span></span><span class="csv">${formatVND(r.total)}</span></div>
          <div class="cat-stat-track"><div class="cat-stat-fill" style="width:${pct}%"></div></div>
        </div>
      </div>`;
    });
  }

  if(!monthPhotos.length){
    html+=`<div class="stats-empty"><div class="big-icon">📊</div><h3>Chưa có dữ liệu</h3><p>Chụp ảnh kèm số tiền để xem thống kê tháng này</p></div>`;
  }

  el.innerHTML=html;
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

document.addEventListener('DOMContentLoaded',()=>{
  loadPhotos();
  localLegacyPhotos=photos.filter(p=>!p.ownerUid);
  updateThumbPreview();startCamera();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
});
</script>
